kind: Deployment
apiVersion: apps/v1
metadata:
  name: prometheus-deployment
  namespace: flask-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090

