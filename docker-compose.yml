version: '3.9'

services:
    web:
      build: .
      #image: root938/flask-two-tier-web:1.1
      container_name: flask-two-tier-web
      ports:
        - "5000:5000"
      environment:
        DB_HOST: postgres
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: userdb
      networks:
        - data
      depends_on:
        postgres:
          condition: service_healthy
      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "5"

    postgres:
      image: postgres:16
      container_name: postgres
      ports:
        - "5432:5432"
      volumes:
        - ./data_storage:/var/lib/postgresql/data
      environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: userdb
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
      networks:
        - data
    filebeat:
      image: docker.elastic.co/beats/filebeat:9.3.0
      user: root
      volumes: 
        - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
        - /var/lib/docker/containers:/var/lib/docker/containers:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
      networks:
        - data
networks:
  data:


